; Windstation Kollund – Prototyp
; Board: Heltec WiFi LoRa 32 V3 (HTIT-WB32LAF, ESP32-S3 + SX1262, 868 MHz)
;
;   pio run -e lorawan -t upload -t monitor      Sensoren + TTN-Uplinks
;   pio run -e sensortest -t upload -t monitor   nur Sensoren, Funk bleibt AUS

[env]
platform = espressif32@6.10.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_filters = direct
lib_deps =
	jgromes/RadioLib@7.1.2
	olikraus/U8g2@2.35.30
upload_port = COM11
monitor_port = COM11

[env:lorawan]

[env:sensortest]
build_flags = -DNO_LORA
